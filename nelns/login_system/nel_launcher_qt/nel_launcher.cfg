
// host where to find the login server
StartupHost = "localhost";

// the html access
StartupPage = "/index.php";

// first parameter is the application name, the ClientApplication of the shard in the login service.
// second is the program started with the cookie and the frontend address, relative to the third param
// (without a directory, it is searched in the PATH).
// third is the directory the program is started in (empty to start it in the current directory).
Application = { "snowballs", "./snowballs_client", "./" };

// page the Sign Up button opens in the web browser; without it the button is disabled
// (NeLNS has no sign up page, its login service can accept unknown users, see AcceptUnknownUsers)
//SignUpURL = "https://example.ryzom.dev/signup";

VerboseLog = 1;

UseDirectClient = 0;

