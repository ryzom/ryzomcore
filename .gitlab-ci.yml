stages:
  - build
  - release

# Builds the ryzom_forgery wheel and publishes it to this project's generic
# package registry, under a fixed URL keyed by the branch (CI_COMMIT_REF_SLUG),
# overwritten on every publish -- see /repos/project-todos/ryztart/forgery_integration.md
build_forgery_wheel:
  stage: build
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == "main/forgery-release"
      changes:
        - nel/tools/forgery/**/*
        - .gitlab-ci.yml
  before_script:
    - python --version ; pip --version
    - pip install --upgrade pip build
  script:
    - cd nel/tools/forgery
    - python -m build --wheel --outdir ../../../build .
  artifacts:
    paths:
      - build/ryzom_forgery-*-py3-none-any.whl
    expire_in: 1 week

upload_forgery_wheel:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main/forgery-release"
      changes:
        - nel/tools/forgery/**/*
        - .gitlab-ci.yml
  needs:
    - job: build_forgery_wheel
  script:
    - |
      wheel=$(ls build/ryzom_forgery-*-py3-none-any.whl)
      # The registry path (version folder) can contain hyphens, but the
      # uploaded *filename* must be a valid wheel name (PEP 427): the
      # version field is delimited by "-", so CI_COMMIT_REF_SLUG's own
      # hyphens (main-forgery-release) would break pip's parsing of it --
      # underscore instead, filename-only.
      version_tag="${CI_COMMIT_REF_SLUG//-/_}"
      curl --fail-with-body -sS \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$wheel" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ryzom_forgery/$CI_COMMIT_REF_SLUG/ryzom_forgery-$version_tag-py3-none-any.whl"
