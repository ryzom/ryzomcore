// Naming service of the class transport sample.
// WindowStyle only applies when the service is started by hand; under servdash_cli the
// --ctrl argument replaces the window with the dashboard console.
WindowStyle = "WIN";

NSHost = "localhost";
SId = 1;
DontUseNS = 1;
DontUseAES = 1;

NegFiltersDebug = { "NETL" };
NegFiltersInfo = { "NETL" };

// labels and buttons of the console: an empty entry starts a new row, @Name|command is a button
DisplayedVariables = { "", "@Services|nsServices" };

UniqueOnShardServices = { "WS" };
UniqueByMachineServices = { };
