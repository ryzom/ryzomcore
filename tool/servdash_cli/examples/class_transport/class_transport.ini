; The NeL class transport sample under servdash_cli: a naming service, then the AI and GD
; sample services that exchange transport classes through it. The service executables and
; their DLLs must be on the PATH (build/bin and the externals). Run from this directory:
;   servdash_cli class_transport.ini
; Each service runs in its own subdirectory with its config file; logs and the launch control
; files of the naming service land there too and are ignored by git.
[]
Title=NeL class transport sample

[ns]
Title=Naming Service
ReadyPattern=^[^*].+Service Console
WorkingDirectory=.\ns
LaunchCmd=ryzom_naming_service
LaunchArgs=-C. -L.
LaunchCtrl=.\ns.launch_ctrl,.\ns.state,LAUNCH,RUNNING,STOP,STOPPED
Control=1
Priority=1

[ais]
Title=AI Service
ReadyPattern=^[^*].+Service Console
WorkingDirectory=.\ais
LaunchCmd=nl_sample_ct_ai_service
LaunchArgs=-C. -L.
Control=1
Priority=2

[gds]
Title=GD Service
ReadyPattern=^[^*].+Service Console
WorkingDirectory=.\gds
LaunchCmd=nl_sample_ct_gd_service
LaunchArgs=-C. -L.
Control=1
Priority=2
