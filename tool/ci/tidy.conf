# HTML Tidy settings for tool/ci/syntax_check.py: report markup errors only.
quiet: yes
show-warnings: no
show-info: no
show-errors: 6
force-output: yes
drop-empty-elements: no
input-encoding: utf8
# Tags that are not HTML but occur on purpose: the in-game help's language sections
# (<en>, <fr>, ...), and the namespaced tags Word left in the world editor class docs.
new-blocklevel-tags: en, fr, de, es, ru, wk
new-inline-tags: o:p, o:smarttagtype, u1:p, u2:p, u3:p, st1:place
