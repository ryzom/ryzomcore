name: "Ryzom Core: CI / CD"

on:
  push:
    branches: [ "core4", "feature/*" ]

  pull_request:
    branches: [ "core4" ]

  workflow_dispatch:

jobs:
  strings:
    runs-on: ubuntu-latest
    outputs:
      build-dir: ${{ steps.strings.outputs.build-dir }}
      install-dir: ${{ steps.strings.outputs.install-dir }}
      build-version: ${{ steps.strings.outputs.build-version }}
      image-version: ${{ steps.strings.outputs.image-version }}
      image-group: ${{ steps.strings.outputs.image-group }}
    steps:
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "install-dir=${{ github.workspace }}/build/install" >> "$GITHUB_OUTPUT"
          COMMIT_HASH=${{ github.sha }}
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "${{ github.event.repository.default_branch }}" ] && VERSION=latest
          IMAGE_GROUP=ghcr.io/${{ github.repository_owner }}
          IMAGE_GROUP=$(echo $IMAGE_GROUP | tr '[A-Z]' '[a-z]')
          echo VERSION=$VERSION
          echo IMAGE_GROUP=$IMAGE_GROUP
          echo "build-version=${VERSION}+sha.${COMMIT_HASH:0:8}" >> "$GITHUB_OUTPUT"
          echo "image-version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image-group=${IMAGE_GROUP}" >> "$GITHUB_OUTPUT"

  nel:
    name: "NeL"
    needs: [ strings ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          key: nel-${{ matrix.os }}-${{ hashFiles('nel/**', '.github/nel/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          path: ${{ needs.strings.outputs.build-dir }}/nel/nel-*

      - uses: ./.github/nel
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          build-dir: ${{ needs.strings.outputs.build-dir }}
          build-version: ${{ needs.strings.outputs.build-version }}
          os: ${{ matrix.os }}

      - uses: actions/upload-artifact@v4
        with:
          name: nel-${{ matrix.os }}-${{ needs.strings.outputs.build-version }}
          path: ${{ needs.strings.outputs.build-dir }}/nel/nel-*
          if-no-files-found: error


  nelns:
    name: "NeL Network Services"
    needs: [ strings, nel ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          key: nelns-${{ matrix.os }}-${{ hashFiles('build/nel-*.sh', 'nelns/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          path: ${{ needs.strings.outputs.build-dir }}/nelns/nelns-*

      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          pattern: nel-${{ matrix.os }}-*
          merge-multiple: true
          path: ${{ needs.strings.outputs.build-dir }}

      - uses: lukka/get-cmake@latest
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cmakeVersion: "^3.29.5"

      - name: Dependencies Linux
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt install --yes \
            build-essential ccache \
            bison autoconf automake \
            libpng-dev \
            libjpeg-dev \
            libgif-dev libfreetype6-dev \
            freeglut3-dev \
            liblua5.2-dev libluabind-dev libcpptest-dev \
            libogg-dev libvorbis-dev libopenal-dev \
            libavcodec-dev libavformat-dev libavdevice-dev libswscale-dev libpostproc-dev \
            libmysqlclient-dev \
            libcurl4-openssl-dev libssl-dev \
            libsquish-dev \
            liblzma-dev \
            libgsf-1-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools

      - name: Install Dependency
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: >
          sh ${{ needs.strings.outputs.build-dir }}/nel-*.sh
          --skip-license
          --include-subdir
          --prefix=${{ needs.strings.outputs.install-dir }}

      - name: Configure CMake
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: cmake --preset ci-linux-nelns

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --build --preset nelns

      - name: Test
        if: steps.cache.outputs.cache-hit != 'true'
        run: ctest --preset nelns

      - uses: actions/upload-artifact@v4
        if: ( !cancelled() ) && matrix.os == 'ubuntu-24.04' && steps.cache.outputs.cache-hit != 'true'
        with:
          name: nelns-test-results
          if-no-files-found: error
          path: ${{ needs.strings.outputs.build-dir }}/reports/*.xml

      - name: Package
        if: steps.cache.outputs.cache-hit != 'true'
        run: cpack --preset nelns -R "${{ needs.strings.outputs.build-version }}"

      - name: Build Docker image
        if: matrix.os == 'ubuntu-24.04' && steps.cache.outputs.cache-hit != 'true'
        run: |
          IMAGE_TAG="${{ needs.strings.outputs.image-group }}/ryzomcore-nelns:${{ needs.strings.outputs.image-version }}"
          docker build . --file nelns/docker/Dockerfile --tag "${IMAGE_TAG}"
          docker save --output=${{ needs.strings.outputs.build-dir }}/nelns/nelns-docker-${{ needs.strings.outputs.build-version }}.tar "${IMAGE_TAG}"

      - uses: actions/upload-artifact@v4
        with:
          name: nelns-${{ matrix.os }}-${{ needs.strings.outputs.build-version }}
          path: ${{ needs.strings.outputs.build-dir }}/nelns/nelns-*
          if-no-files-found: error


  snowballs:
    name: "Snowballs"
    needs: [ strings, nel ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          key: snowballs-${{ matrix.os }}-${{ hashFiles('build/nel-*.sh', 'snowballs2/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          path: ${{ needs.strings.outputs.build-dir }}/snowballs/snowballs-*

      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          pattern: nel-${{ matrix.os }}-*
          merge-multiple: true
          path: ${{ needs.strings.outputs.build-dir }}

      - uses: lukka/get-cmake@latest
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cmakeVersion: "^3.29.5"

      - name: Dependencies Linux
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt install --yes \
            build-essential ccache \
            bison autoconf automake \
            libpng-dev \
            libjpeg-dev \
            libgif-dev libfreetype6-dev \
            freeglut3-dev \
            liblua5.2-dev libluabind-dev libcpptest-dev \
            libogg-dev libvorbis-dev libopenal-dev \
            libavcodec-dev libavformat-dev libavdevice-dev libswscale-dev libpostproc-dev \
            libmysqlclient-dev \
            libcurl4-openssl-dev libssl-dev \
            libsquish-dev \
            liblzma-dev \
            libgsf-1-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools

      - name: Install Dependency
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: >
          sh ${{ needs.strings.outputs.build-dir }}/nel-*.sh
          --skip-license
          --include-subdir
          --prefix=${{ needs.strings.outputs.install-dir }}

      - name: Configure CMake
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: cmake --preset ci-linux-snowballs

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --build --preset snowballs

      - name: Test
        if: steps.cache.outputs.cache-hit != 'true'
        run: ctest --preset snowballs

      - uses: actions/upload-artifact@v4
        if: ( !cancelled() ) && matrix.os == 'ubuntu-24.04' && steps.cache.outputs.cache-hit != 'true'
        with:
          name: snowballs-test-results
          if-no-files-found: error
          path: ${{ needs.strings.outputs.build-dir }}/reports/*.xml

      - name: Package
        if: steps.cache.outputs.cache-hit != 'true'
        run: cpack --preset snowballs -R "${{ needs.strings.outputs.build-version }}"

      - name: Build Docker image
        if: matrix.os == 'ubuntu-24.04' && steps.cache.outputs.cache-hit != 'true'
        run: |
          IMAGE_TAG="${{ needs.strings.outputs.image-group }}/ryzomcore-snowballs:${{ needs.strings.outputs.image-version }}"
          docker build . --file snowballs2/docker/Dockerfile --tag "${IMAGE_TAG}"
          docker save --output=${{ needs.strings.outputs.build-dir }}/snowballs/snowballs-docker-${{ needs.strings.outputs.build-version }}.tar "${IMAGE_TAG}"

      - uses: actions/upload-artifact@v4
        with:
          name: snowballs-${{ matrix.os }}-${{ needs.strings.outputs.build-version }}
          path: ${{ needs.strings.outputs.build-dir }}/snowballs/snowballs-*


  studio:
    name: "Studio"
    needs: [ strings, nel ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          key: studio-${{ matrix.os }}-${{ hashFiles('build/nel-*.sh', 'studio/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          path: ${{ needs.strings.outputs.build-dir }}/studio/studio-*

      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          pattern: nel-${{ matrix.os }}-*
          merge-multiple: true
          path: ${{ needs.strings.outputs.build-dir }}

      - uses: lukka/get-cmake@latest
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cmakeVersion: "^3.29.5"

      - name: Dependencies Linux
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt install --yes \
            build-essential ccache \
            bison autoconf automake \
            libpng-dev \
            libjpeg-dev \
            libgif-dev libfreetype6-dev \
            freeglut3-dev \
            liblua5.2-dev libluabind-dev libcpptest-dev \
            libogg-dev libvorbis-dev libopenal-dev \
            libavcodec-dev libavformat-dev libavdevice-dev libswscale-dev libpostproc-dev \
            libmysqlclient-dev \
            libcurl4-openssl-dev libssl-dev \
            libsquish-dev \
            liblzma-dev \
            libgsf-1-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqtpropertybrowser-dev

      - name: Install Dependency
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: >
          sh ${{ needs.strings.outputs.build-dir }}/nel-*.sh
          --skip-license
          --include-subdir
          --prefix=${{ needs.strings.outputs.install-dir }}

      - name: Configure CMake
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: cmake --preset ci-linux-studio

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --build --preset studio

      - name: Package
        if: steps.cache.outputs.cache-hit != 'true'
        run: cpack --preset studio -R "${{ needs.strings.outputs.build-version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.os }}-${{ needs.strings.outputs.build-version }}
          path: ${{ needs.strings.outputs.build-dir }}/studio/studio-*


  publish:
    needs: [ strings, nelns, snowballs ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch ) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-ubuntu-24.04-*"
          merge-multiple: true
          path: ${{ needs.strings.outputs.build-dir }}

      - run: find ${{ needs.strings.outputs.build-dir }} -type f -iname *-docker-* -exec docker load --input {} \;

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
          docker push "${{ needs.strings.outputs.image-group }}/ryzomcore-nelns"
          docker push "${{ needs.strings.outputs.image-group }}/ryzomcore-snowballs"
