// Recovered Snowballs .zonel production lighting configuration (2001-10 vintage).
//
// Nobody saved the original config; this file is the reverse-engineered recovery,
// validated byte-level against the 96 reference .zonel of snowballs-data-20011030
// with the resurrected 2001-10 lighter (zone_lighter_2001, NL2001_ANALYTIC_LATTICE=1,
// zero displacement noise): 88.1% of 4x4 lumel blocks byte-identical, 98.1% of lumel
// values exact, 99.9% within +-3 (era block codec, snowballs_zonel_gate.py).
// Residuals are x87-vs-SSE float rounding (+-1 tier), post-lighting asset drift
// (objects added to instance groups after zones were lit, e.g. 6_AN; re-sculpted
// sources), and zone-edge welds. No parameter explains them better.
//
// Evidence per parameter:
//  - sun_direction: 152k+ unshadowed lumels sit exactly on ref = 255*(-N.D); the fit
//    converges 0.024 deg from the literal below, which survived only as a commented-out
//    line in the committed landscape_builder cfg (the committed active value postdates
//    the refs).
//  - sky_contribution/sky_intensity: sun-dim patches floor at 255*SI*Nz*sin^2(openPhi);
//    flat open patches floor at 204 (=0.8*255*sin^2(255/256*Pi/2)). SI=0.75 leaves a
//    tight uniform +10..13 deficit (ratio 1.066), SI=0.8 collapses it: 3_AK jumps from
//    39% to 86% blocks byte-identical. The committed sky=0/0.25 postdates the refs.
//  - dependencies: the 8-neighbour ring (3x3). A 5x5 neighbourhood wrecks the gate
//    (3_AK 86% -> 65% blocks), no deps wrecks it worse (4%); the heightfield horizon
//    (global illumination) built from exactly 3x3 matches.
//  - shadow/softshadow: zones with instance groups gate slightly BETTER than zones
//    without (98.24% vs 97.68% values exact), so the polygonal soft shadows with the
//    committed-cfg knobs below reproduce the reference tree/object shadows.
//  - displacement noise: zero everywhere (pure bezier lattice matches 98%); the client
//    bank's displacement map entries are empty.
//
// Paths below are placeholders - point them at the snowballs data
// (zones+igs need a lowercase mirror on case-sensitive filesystems; shapes keep
// their original mixed case).

bank_path = "/path/to/snowballs/data/tiles/bank.bank";
ig_path = "/path/to/lowercase/zones";
shapes_path = "/path/to/snowballs/data/shapes";
maps_path = "/path/to/lowercase/zones";

// Extra instance groups (none)
additionnal_ig = {
};

// Sun direction. The pre-2001-10-26 value: the refs (20011030 data) were lit with it.
sun_direction = { -0.095, +1.0, -0.50 };

// Zone to light and output are given on the command line:
//   zone_lighter_2001 <zone.zonel> <output.zonel> <this.cfg> <dependencies.cfg>
// dependencies.cfg: dependencies = { "r_cc", ... };  // the 8 direct neighbours

// Shadows (landscape self-shadow + instance-group shapes)
shadow = 1;
load_ig = 1;

// Polygonal soft shadows (values as committed in the era landscape_builder cfg;
// consistent with the refs, see above)
softshadow = 1;
softshadow_blur_size = 1.0;
softshadow_fallof = 10.0;
softshadow_shape_vertex_count = 10;
shadow_bias = 1.0;

// No oversampling
oversampling = 0;

// Sun and sky
sun_contribution = 1;
sky_contribution = 1;
sky_intensity = 0.8;

// Sky-visibility heightfield (global illumination)
global_illumination_cell_size = 5;
global_illumination_length = 600;

// Raytrace quad grid
quad_grid_size = 512;
quad_grid_cell_size = 1;

// Threads
cpu_num = 2;
