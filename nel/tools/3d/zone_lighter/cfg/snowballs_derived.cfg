// DERIVED modern zone_lighter configuration for the Snowballs zones.
//
// Direct translation of the recovered 2001 production lighting parameters
// (see nel/tools/3d/zone_lighter_2001/cfg/snowballs_recovered.cfg for the
// recovery evidence) onto the modern zone_lighter schema. The modern lighter
// kept the 2001 combine formula and sky model unchanged; only the shadow
// implementation moved from polygonal soft shadows to the zbuffer sun camera.
// Penumbra equivalence: era blur_size/fallof = 1m/10m = 0.1 rad is exactly the
// modern default sun_radius/sun_distance = 5000/50000.
//
// Validated by relighting all 96 reference zones (snowballs-data-20011030)
// with this configuration: 87.8% of lumels exact, 97.5% within +-3, 98.2%
// within +-8 of the 2001 references (residual = modern >>8 codec vs era /7,/5
// dequant skew, zbuffer-vs-polygonal shadow edges, x87-vs-SSE float tier,
// post-lighting asset drift). snowballs_corpus.py runs this as a gated tier.
//
// @TOKEN@ paths are substituted by snowballs_corpus.py; fill them in by hand
// for manual use. Zones+igs must be reachable under their lowercase names on
// case-sensitive filesystems; shapes keep their original mixed case.

// Bank file name
bank_name = "@BANK@";

// Search pathes for shape and ig
search_pathes =
{
	"@ZONES@",
	"@SHAPES@"
};

// Additional ig file name
additionnal_ig =
{
};

// Sun direction: recovered pre-2001-10-26 production value
sun_direction = { -0.095, 1.0, -0.50 };

// Load instance group. 0 disable, 1 enable
load_ig = 1;

// Enable shadows. 0 disable, 1 enable
shadow = 1;

// Center of the landscape pointed by the sun: snowballs map bbox center
sun_center = { 1599, -835, 0 };

// Sun camera: modern defaults; ratio matches the era softshadow penumbra
sun_distance = 50000;
sun_fov = 0.52359877;	// Pi/6
sun_radius = 5000;

zbuffer_landscape_size = 32768;
zbuffer_object_size = 98304;
soft_shadow_samples_sqrt = 4;
soft_shadow_jitter = 0.4;

// Enable the sun contribution. 0 disable, 1 enable
sun_contribution = 1;

// Sky global illumination: recovered production values (the committed era cfg
// state 0/0.25 postdates the reference zones)
sky_contribution = 1;
sky_intensity = 0.8;

// Sky-visibility heightfield: recovered production values
global_illumination_cell_size = 5;
global_illumination_length = 600;

// Water lighting (modern-only; the snowballs refs predate lit water)
water_shadow_bias = 0.8;
water_ambient = 0.3;
water_diffuse = 1.0;
modulate_water_color = 0;
sky_contribution_for_water = 0;
vegetable_height = 2;

// Raytrace quad grid: recovered production values
quad_grid_size = 512;
quad_grid_cell_size = 1;

// Number of CPU used to calculate the lightmaps. 0 for automatic detection.
cpu_num = 0;
