[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynel"
version = "0.1.0"
description = "Python tools for Ryzom/NeL data formats (.ig, .shape, .bnp) and admin protocols"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
ryzom-ig = "pynel.ryzom_ig:_main"
ryzom-shape = "pynel.ryzom_shape:_main"
ryzom-bnp = "pynel.ryzom_bnp:_main"

[tool.setuptools]
packages = ["pynel"]
