[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ryzom_forgery"
version = "0.1.0"
description = "Shared Panda3D + ImGui scaffolding for the Ryzom Forgery tool suite"
requires-python = ">=3.10"
dependencies = ["panda3d", "panda3d-imgui", "numpy", "pycollada", "pygltflib"]

[tool.setuptools]
packages = ["ryzom_forgery"]
