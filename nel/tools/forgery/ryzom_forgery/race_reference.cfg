// Race/gender reference data for hairstyle_conform.py's cross-race boundary
// snap -- see race_reference.py for the full explanation and
// nel/tools/forgery/docs/apps/hairstyle_conform.md for how this is used.
//
// Per race/gender key (e.g. "fy_hof" = Fyros Homme/male): the race's own
// face mesh, and any hairstyle of that race/gender that fully covers the
// skull (a "shave01"/bald-cap style is the natural choice) -- used as the
// reference to identify a hairstyle's real seam loop (when this race/gender
// is the source of a conform) or to build the canonical seam ring to
// interpolate against (when it's the target). Neither file is bundled with
// Forgery (real game data) -- resolved by name through the caller's own
// search paths, same as every texture reference elsewhere in this suite.
//
// A workspace race_reference.cfg, if present, always overrides this bundled
// default entirely (see race_reference.py) -- copy this file into a
// workspace as an editable starting point (e.g. to add more race/gender
// keys, or point at a different reference hairstyle).

fy_hof_face = "fy_hof_visage.shape";
fy_hof_reference_hairstyle = "fy_hof_cheveux_shave01.shape";

tr_hof_face = "tr_hof_visage.shape";
tr_hof_reference_hairstyle = "tr_hof_cheveux_shave01.shape";
