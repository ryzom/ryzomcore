# Ryzom Panoply color-shift parameters, consolidated from the real production
# configs (ryzom-data/leveldesign/workspace/common/characters_maps_hr/
# panoply_common.cfg + panoply_<race>.cfg, snapshotted 2026-08-19) into one
# file bundled with Forgery -- avoids needing the user's search paths to
# cover leveldesign/ just to read these constants. See
# .todo/forgery-object-editor.md "génération live des textures Panoply" and
# ryzom_forgery/panoply_colorize.py. If ryzom-data's real palette ever
# changes, regenerate this file by hand from the source .cfg files.
#
# "skin" and "user" are common to every race (panoply_common.cfg). "hair" and
# "eyes" are per-race (panoply_<race>.cfg) -- which race's table applies to a
# given texture is decided by which race's asset folder it was built from,
# not by anything in this file; zorai has no "eyes" axis at all (no such
# masks exist for that race), and "generique" (shared/non-race-specific
# actors) has neither hair nor eyes.
#
# Each [[<axis>.color]]/[[<race>.<axis>.color]] entry mirrors one index
# across a source .cfg's "<axis>_hues"/"_lightness"/"_saturations"/
# "_luminosities"/"_constrasts"/"_color_id" parallel arrays: hue is an
# absolute target in degrees [0, 360), lightness/saturation are relative
# deltas added to the bitmap's own averaged value, luminosity/contrast are
# in [-100, 100] (Photoshop-like) -- see panoply_colorize.convert_bitmap's
# matching parameters, which these feed directly.

