// Ryzom Panoply color-shift parameters, bundled with Forgery so Patina and
// apps/panoply_maker.py never need a user to pick or hand-craft one of the
// real production panoply_*.cfg files (Patina is an end-user tool). This is
// the same real production data, consolidated from
// ryzom-data/useful_stuff/_tools/panoply/panoply_common.cfg +
// panoply_fyros.cfg/panoply_matis.cfg/panoply_tryker.cfg/panoply_zorai.cfg
// (snapshotted 2026-08-29) into ONE file -- see
// /repos/project-todos/ryzom-core/panoply-runtime-tint.md "Unified
// panoply.cfg + Patina integration" for the full writeup.
//
// Colors only -- no input_path/output_path/hls_info_path/cache_path/
// mask_extensions here, those are Patina's/the CLI's own responsibility, not
// configured by this file.
//
// "skin"/"user" are common to every race (unprefixed, matches the real
// panoply_common.cfg key names exactly). "hair"/"eyes" are per-race, so
// their keys carry a "<race>_" prefix (CConfigFile has no native
// race-scoping, unlike the real workflow which loaded a different file per
// race) -- e.g. fyros_hair_hues, matis_eyes_color_id. zorai has no
// zorai_eyes_* keys at all (no such masks exist for that race). "generique"
// (non-race-specific actors) has neither hair nor eyes -- nothing to add
// for it beyond the common skin/user tables above.
//
// If ryzom-data's real palette ever changes, regenerate this file by hand
// from the source .cfg files listed above.
//
// A workspace panoply.cfg, if present, always overrides this bundled
// default entirely (see panoply_config.py) -- copy this file into a
// workspace (via Patina's "copy panoply.cfg to workspace" button) as an
// editable starting point.

/////////////////////////////////////////////

// hues are in the [0, 360] range and are interpreted as an absolute value
// 0 Red / 60 Yellow / 120 Green / 180 Cyan / 240 Blue / 300 Magenta
//
// lightness/saturations are in the [-1, 1] range and are interpreted as a
// relative value (added to the bitmap's own measured HLS under the mask)
//
// luminosities is interpreted as an added gray level, usually -100 to 100
// (like Photoshop). A luminosity of 0 means it is unmodified.
// constrasts (sic, matches the real config key's typo) modulate the
// distance between color components and the average grey in the bitmap:
// 0 = unmodified, 100 = pure colors, -100 = grey.
//
// color_id defines the letters used to build the output file name.

