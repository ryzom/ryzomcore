skin_lightness   = { -0.1, 0.1, 0.0, -0.2 };
skin_saturations = { 0.05, -0.15, 0.0, -0.3 };
skin_luminosities = { 0.0, 0.0, 0.0, 0.0 };
skin_constrasts  = { 0.0, 0.0, 0.0, 0.0 };
skin_color_id    = { "FY", "MA", "TR", "ZO" };

