// Georges Editor Qt - Default Configuration
// This file is loaded from the current working directory on startup.
// All other paths (RootSearchDirectory, SearchPaths) are resolved relative
// to the project root — the nearest ancestor folder containing a ".nel"
// marker directory. This matches the planar_reflection sample pattern.
//
// Project root layout: .nel/, code/, leveldesign/, graphics/, ...
// The tool can be launched from anywhere inside the project tree.

// Root search directory for .typ, .dfn, and form files.
// Resolved relative to the project root (folder containing .nel/).
// Added recursively to CPath on startup, matching MFC initCfg().
RootSearchDirectory = "leveldesign";

// Sub-folder within root for .typ and .dfn files (used by file browser).
// Matches MFC TypDfnSubFolder variable.
TypDfnSubFolder = "DFN/";

// Additional search paths for language data files etc.
// Also resolved relative to the project root.
SearchPaths = { "code/nel/tools/georges/georges_editor_qt/data" };

// File extension remapping (e.g. ".tga", ".png")
RemapExtensions = { };

// Language code for UI translations (en, fr, de, etc.)
LanguageCode = "en";

// Qt style (e.g. "Fusion", "Windows", "WindowsVista")
QtStyle = "Fusion";

// Use standard palette from style (false = use dark palette)
QtPalette = 0;

// Whether to save this config on exit
SaveConfig = 1;

// Log negative filters
NegFiltersDebug = { };
NegFiltersInfo = { };
NegFiltersWarning = { };
NegFiltersAssert = { };
NegFiltersError = { };

// Default type for new type documents
DefaultType = "default.typ";

// Default DFN for new form documents
DefaultDfn = "default.dfn";

// Maximum number of recent files to remember
MaxRecentFiles = 10;

// Maximum undo steps
MaxUndo = 20;

// Start with tree nodes expanded
StartExpanded = 1;

// Remember window geometry and dock state between sessions
RememberWindowState = 0;

// Super user mode (enables advanced features)
SuperUser = 1;
