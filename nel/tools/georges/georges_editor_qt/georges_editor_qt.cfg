// Georges Editor Qt - Default Configuration
// This file is loaded on startup. Edit to configure search paths,
// language, display options, and tool-specific settings.
//
// The working directory defaults to the '.nel/tools/' folder inside the
// project root. The project root (parent of .nel/) also contains
// 'leveldesign/', 'graphics/', etc. Relative paths are used so the
// default configuration works on both Windows and Linux.
// Variable names match the original MFC georges.cfg for compatibility.

// Root search directory for .typ, .dfn, and form files.
// This is added recursively to CPath on startup, matching MFC initCfg().
// Default is relative to working dir (.nel/tools/): ../../leveldesign
RootSearchDirectory = "../../leveldesign";

// Sub-folder within root for .typ and .dfn files (used by file browser).
// Matches MFC TypDfnSubFolder variable.
TypDfnSubFolder = "DFN/";

// Additional search paths (for language data files etc.)
// The "data" entry finds the .uxt language files relative to working dir.
SearchPaths = { "data" };

// File extension remapping (e.g. ".tga", ".png")
RemapExtensions = { };

// Language code for UI translations (en, fr, de, etc.)
LanguageCode = "en";

// Qt style (e.g. "Fusion", "Windows", "WindowsVista")
QtStyle = "Fusion";

// Use standard palette from style (false = use dark palette)
QtPalette = 0;

// Whether to save this config on exit
SaveConfig = 1;

// Log negative filters
NegFiltersDebug = { };
NegFiltersInfo = { };
NegFiltersWarning = { };
NegFiltersAssert = { };
NegFiltersError = { };

// Default type for new type documents
DefaultType = "default.typ";

// Default DFN for new form documents
DefaultDfn = "default.dfn";

// Maximum number of recent files to remember
MaxRecentFiles = 10;

// Maximum undo steps
MaxUndo = 20;

// Start with tree nodes expanded
StartExpanded = 1;

// Remember window geometry and dock state between sessions
RememberWindowState = 0;

// Super user mode (enables advanced features)
SuperUser = 1;
