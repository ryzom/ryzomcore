// Georges Editor Qt - Default Configuration
// This file is loaded on startup. Edit to configure search paths,
// language, display options, and tool-specific settings.

// NeL search paths for .typ, .dfn, and form files (leveldesign data)
// Also includes the data directory for language files (.uxt)
SearchPaths = { "data" };

// File extension remapping (e.g. ".tga", ".png")
RemapExtensions = { };

// Language code for UI translations (en, fr, de, etc.)
LanguageCode = "en";

// Qt style (e.g. "Fusion", "Windows", "WindowsVista")
QtStyle = "Fusion";

// Use standard palette from style (false = use dark palette)
QtPalette = 0;

// Whether to save this config on exit
SaveConfig = 1;

// Log negative filters
NegFiltersDebug = { };
NegFiltersInfo = { };
NegFiltersWarning = { };
NegFiltersAssert = { };
NegFiltersError = { };

// Georges-specific settings
// Sub-directory within search paths for .typ/.dfn files
TypDfnSubDirectory = "";

// Default type for new type documents
DefaultType = "";

// Default DFN for new form documents
DefaultDfn = "";

// Maximum number of recent files to remember
MaxRecentFiles = 10;

// Maximum undo steps
MaxUndo = 50;

// Start with tree nodes expanded
StartExpanded = 1;

// Remember window geometry and dock state between sessions
RememberWindowState = 0;
