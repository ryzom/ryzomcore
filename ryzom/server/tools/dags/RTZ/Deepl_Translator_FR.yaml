name: DeepL.FR
description: Translate messages to FR using DeepL
group: RTZ
timeoutSec: 0
env:
  - DEEPL_LANG: fr
  - MARGUEZ_PRIO: 99
  - WORKING_DIR: /home/nevrax/repos/ryzom-core/ryzom/server/tools/rytranszulip
  - LOG_FILE: ${WORKING_DIR}/.translator_${DEEPL_LANG}.out
  - PYTHONPATH: /home/nevrax/shard/tools/
steps:
  - name: run
    command: bash /home/nevrax/repos/ryzom-core/ryzom/server/tools/marguez/monitor_script.sh translator.py ${DEEPL_LANG}

