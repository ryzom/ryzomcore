name: Zulip.Dispatcher
description: Send messages to Zulip
group: RTZ
timeoutSec: 0
env:
  - MARGUEZ_PRIO: 99
  - WORKING_DIR: /home/nevrax/repos/ryzom-core/ryzom/server/tools/rytranszulip
  - LOG_FILE: ${WORKING_DIR}/.zulip_dispatcher.out
  - DB_RyzomMessages: "['Ryzom-Chat-LastID', 'Ryzom-Chat-{}', '']"
  - DB_ZulipMessages: "['Ryzom-Chat-LastID', 'Zulip-{}-MessageID', '']"
  - PYTHONPATH: /home/nevrax/shard/tools/
steps:
  - name: run
    command: bash /home/nevrax/repos/ryzom-core/ryzom/server/tools/marguez/monitor_script.sh zulip_dispatcher.py
