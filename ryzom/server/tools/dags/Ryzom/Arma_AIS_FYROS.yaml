name: Arma_AIS_FYROS
description: Ryzom Ai Service
tags: P_87
group: Shard
maxActiveRuns: -1
env:
  - LC_ALL: "C"
  - LANGUAGE: ""
  - LOG_FILE: "/home/nevrax/shard/logs/ai_service_ais_fyros.log"
  - LOG_FORMAT_REGEX: "([0-9\/]+ [0-9:]+) (INF|WRN)?[^:]+: (.*)"
  - LOG_FORMAT_FINAL: "[white]\\1[/white][\\2] \\3[/\\2]"
  - LOG_FORMAT_SUBST: "{'[]': '[bright_white]', '[/]': '[/bright_white]', 'INF': 'bright_yellow', 'WRN': 'deep_pink2'}"
  - STATUS_UPDATER: "Dag-ais_fyros-"
steps:
  - name: run
    dir: /home/nevrax/shard/run/
    command: python3 /home/nevrax/shard/tools/service_launcher.py ais_fyros ../sbin/ryzom_ai_service -C../cfgs -L../logs -Nais_fyros --nobreak --writepid -mCommon:Indoors:Fyros:FyrosNewbie:FyrosIsland:Post
handlerOn:
  cancel:
    command: echo "Canceled"
  failure:
    command: bash /home/nevrax/shard/tools/start_service.sh AIS_FYROS
  success:
    command: bash /home/nevrax/shard/tools/start_service.sh AIS_FYROS
