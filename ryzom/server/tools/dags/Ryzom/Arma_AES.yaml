name: Arma_AES
description: Ryzom Admin Service
tags: P_00
group: Shard
maxActiveRuns: -1
env:
  - LC_ALL: "C"
  - LANGUAGE: ""
  - LOG_FILE: "/home/nevrax/shard/logs/admin_executor_service.log"
  - LOG_FORMAT_REGEX: "([0-9\/]+ [0-9:]+) (INF|WRN)?[^:]+: (.*)"
  - LOG_FORMAT_FINAL: "[white]\\1[/white][\\2] \\3[/\\2]"
  - LOG_FORMAT_SUBST: "{'[]': '[bright_white]', '[/]': '[/bright_white]', 'INF': 'bright_yellow', 'WRN': 'deep_pink2'}"
  - STATUS_UPDATER: "Dag-aes-"
steps:
  - name: run
    dir: /home/nevrax/shard/run/
    command: python3 /home/nevrax/shard/tools/service_launcher.py aes ../sbin/ryzom_admin_service -A. -C../cfgs -L../logs --nobreak --fulladminname=admin_executor_service --shortadminname=AES
handlerOn:
  cancel:
    command: echo "Canceled"
  failure:
    command: bash /home/nevrax/shard/tools/start_service.sh AES
  success:
    command: bash /home/nevrax/shard/tools/start_service.sh AES
