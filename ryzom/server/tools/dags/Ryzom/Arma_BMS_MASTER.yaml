name: Arma_BMS_MASTER
description: Ryzom Backup Service
tags: P_00
group: Shard
maxActiveRuns: -1
env:
  - LC_ALL: "C"
  - LANGUAGE: ""
  - LOG_FILE: "/home/nevrax/shard/logs/backup_service.log"
  - LOG_FORMAT_REGEX: "([0-9\/]+ [0-9:]+) (INF|WRN)?[^:]+: (.*)"
  - LOG_FORMAT_FINAL: "[white]\\1[/white][\\2] \\3[/\\2]"
  - LOG_FORMAT_SUBST: "{'[]': '[bright_white]', '[/]': '[/bright_white]', 'INF': 'bright_yellow', 'WRN': 'deep_pink2'}"
  - STATUS_UPDATER: "Dag-bms_master-"
steps:
  - name: run
    dir: /home/nevrax/shard/run/
    command: python3 /home/nevrax/shard/tools/service_launcher.py bms_master ../sbin/ryzom_backup_service -C../cfgs -L../logs --nobreak --writepid -P49990
handlerOn:
  cancel:
    command: echo "Canceled"
  failure:
    command: bash /home/nevrax/shard/tools/start_service.sh BMS_MASTER
  success:
    command: bash /home/nevrax/shard/tools/start_service.sh BMS_MASTER
