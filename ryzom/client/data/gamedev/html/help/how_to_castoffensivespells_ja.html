      <td align="center">
      <h1>攻撃呪文の唱え方</h1>
      </td>
    </tr>
</table>

<P>
攻撃呪文を唱えるには、敵をクリックしてターゲットにしてから、「アクションバー」にある呪文のアイコンをクリックします。町や村のNPCに攻撃呪文を唱えることはできません。</p>

<br><p>
ゲーム内のほとんどの地域はPvPエリアに指定されていないので、そこではほかのプレイヤーに攻撃呪文を唱えることはできません。
</P>
