      <h1>スタンザ</h1>
      </td>
    </tr>
</table>
<p>
スタンザはアクションを構成する要素です。スタンザを組み合わせて、新しいアクションを作れます。<br>
<br>
<a href="">レベル</a>：このスタンザのレベルを示します。<br>
<a href="">スキル</a>：このスタンザが使うスキルを示します。<br>
<a href="">コストまたはクレジット</a>：アクションの組み合わせの釣り合いを取るために使われる、コストまたはクレジットの値を示します。<br>
<a href="">相対コストまたは相対クレジット</a>：アクションのほかのすべてのスタンザのコストまたはクレジットに、このスタンザが加える割合（%）を示します。<br>
</p>
