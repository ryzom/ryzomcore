<p>ステップ3-2：設計図 - 表示の見方：</p>
<p>色</p>
<table width="75%" border="0">
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_plan03.TGA"></td>
    <td width="91%" valign="middle">緑：マティス</td>
  </tr>
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_plan01.TGA"></td>
    <td width="91%" valign="middle">青：トライカー</td>
  </tr>
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_plan04.TGA"></td>
    <td width="91%" valign="middle">カーキイエロー：フィロス</td>
  </tr>
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_plan05.TGA"></td>
    <td width="91%" valign="middle">カーキグリーン：ゾライ</td>
  </tr>
</table>
<p>シンボル</p>
<p>例：</p>
<table width="75%" border="0">
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_plan01.TGA"></td>
    <td width="91%" valign="middle">トライカー式ロングソードを作るための設計図。</td>
  </tr>
</table>
<p>品質</p>
<p>例：</p>
<table width="75%" border="0">
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_plan01.TGA"></td>
    <td width="91%" valign="middle">品質1～5のトライカー式ロングソードを作るための設計図。右下の数字はレベルを示します。
    </td>
  </tr>
</table>
<p>&nbsp;</p>
<p>製作をすると必ずアイテムができあがり、失敗することはありません。ただし、できあがるアイテムの品質は、使うスキルによって変わります。<br>
</p>
