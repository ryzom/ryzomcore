<p>
採掘を始める前に、採集道具を右手に装備する必要があります。<br>
<br>
<a href="">出自</a>：このアイテムの出自です。<br>
<a href="">品質</a>：<br>
<a href="">重量</a>：このアイテムの重さです。総重量が大きすぎると、移動速度が落ちることがあります。<br>
<a href="">容積</a>：所持品の中でアイテムが占める空間です。所持品の空間にはそれぞれ限りがあるため、かさばるアイテムはたくさん運べません。<br>
<a href="">耐久値</a>：このアイテムの耐久値です。この値はアイテムを使うと減っていきます。0になると、アイテムは壊れます。<br>
