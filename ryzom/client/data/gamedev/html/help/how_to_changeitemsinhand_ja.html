      <td align="center">
      <h1>手に持つアイテムの替え方</h1>
      </td>
    </tr>
</table>

<p>右手に持っているアイテムは、「アクションバー」の右端に表示されます。両手を使うアイテムの場合は、アクションバーの左端にも同じアイコンが半透明で表示されます。</p>
<br><p>右手のアイテムを替えるには、アクションバーの右端にあるアイコンをクリックします。所持品の中で右手に持てるアイテムをすべて表示したウィンドウが開きます。装備したいアイテムをクリックしてください。</p>
<br><p>アイテムを替えたあとの数秒間は、手に持っているアイテムを使うことができません。その間は、アクションバーのアクションアイコンがすべて灰色で表示されます。
</p>
