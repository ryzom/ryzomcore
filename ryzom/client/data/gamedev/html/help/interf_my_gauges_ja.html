<p>
<a href="ah:context_help&target=ui:interface:player:header_opened&text=uiTitle">名前と称号</a>：あなたの名前と、そのあとに、ほかの人に見せるよう選んだ称号が表示されます。

<br><br><a href="ah:context_help&target=ui:interface:player:content:jlife&text=uiLife">HP</a>：あなたの生命力（HP）です。

<br><br><a href="ah:context_help&target=ui:interface:player:content:jsap&text=uiSap">樹液</a>：魔法アクションに使います。

<br><br><a href="ah:context_help&target=ui:interface:player:content:jsta&text=uiStamina">スタミナ</a>：（戦闘などの）あらゆるアクションに使います。

<br><br><a href="ah:context_help&target=ui:interface:player:content:jfoc&text=uiFocus">集中力</a>：探査と素材の採掘に使います。
