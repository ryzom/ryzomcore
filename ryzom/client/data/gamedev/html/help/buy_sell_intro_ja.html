<p>はじめに</p>
<p><br>
  この「NPCとの売買のしかた」の章では、Ryzomで出会うノンプレイヤーキャラクター（NPC）からアイテムを購入したり、NPCにアイテムを売却したりする方法を説明します。新しい持ち物を手に入れ、財産を築くうえで欠かせない手順です。</p>
<p><br>
  この章を無理なく進めるには、まず「NPCとの話し方」の章の内容に慣れ、「特技とアイテム」の章を読んでおく必要があります。</p>
<p><br>
  購入するには、お金（または売るためのアイテム）が必要です。師範が提案する最初のミッションを達成することをおすすめします。</p>
