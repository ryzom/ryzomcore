<p>ステップ3：カメラ<br>
  ゲームには、一人称と三人称の2種類のカメラがあります。</p>
<p>一人称カメラ：<br>
  キャラクターの目を通してゲームを見ます。<br>
  建物の中にいるときは、必ずこのカメラになります。</p>
<p>三人称カメラ：<br>
  ゲームの中の自分のキャラクターを見ます。<br>
  このカメラは、屋外にいるときだけ使えます。</p>
