  ステップ2：文明を選ぶ</p>
<p><br>
  4つの文明の中から選べます。どの文明にも長所と短所があります。現在のベータ版では、マティス文明だけがプレイできます。</p>
<p></p>
<p> <img src="../Graph/create_perso/create_perso_choose_civilization01_512.tga"></p>
<p>プレイしたい文明の円盤を直接クリックするか、その文明の旗を表すアイコンをクリックします。</p>
<p></p>
<p> <img src="../Graph/create_perso/create_perso_choose_civilization02_512.tga"></p>
<p>文明を選ぶと、さまざまな情報が表示されます。その文明の文化と生態系についての説明を読むことができます。</p>
