<p>ステップ2：特技とは？</p>
<p>アティスでは、特技には次のものがあります：</p>
<p>- 近接戦闘や射撃で使う特殊攻撃。</p>
<p>- 呪文を作るための魔法の特技。</p>
<p>- 追跡の特技 - 採集者だけが使えます（未実装）。</p>
<p>- 取引の特技 - 商人だけが使えます。</p>
<p>- 製作の特技 - 職人だけが使えます。<br>
  <br>
