<p>ステップ1-1：アイテム - どこにあるか：</p>
<p>キャラクターの手元：</p>
<p>- セットの中</p>
<p>- バッグの中</p>
<p>アイテムは次の方法で手に入ります：</p>
<p>- 商人から購入する</p>
<p>- ミッションを達成する</p>
<p>- NPCやクリーチャーから戦利品として得る</p>
<p>- 製作する - 職人だけができます</p>
<p>- 地面を掘る、または植物から採る - 採集者だけができます</p>
<p>- クリーチャーを解体する - 採集者だけができます<br>
</p>
