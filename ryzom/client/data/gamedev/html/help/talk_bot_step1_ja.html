        <p><br>
          <br>
          ステップ1：話しかけるNPCを選択する <br>
          Ryzomでは、あなたは自然や、周りで起こる出来事と関わり合っています。ゲームの中で起こる出来事を定期的に知る方法の1つが、友好的なノンプレイヤーキャラクター（NPC）に話しかけることです。</p>
        <p> </p>
        <p>&nbsp;</p>
        <table width="75%" border="0">
          <tr>
            <td><img src="../Graph/talk_bot/how_to_talk_select_zoom01_128_256.tga"></td>
            <td>
              <div align="right"><img src="../Graph/talk_bot/how_to_talk_select_zoom02_128_256.tga"></div>
            </td>
          </tr>
        </table>
        <p><br>
          カーソルをNPCの上に移動すると、マウスポインターの形が変わり、緑のバーに続いて、名前と役割が白で表示されます。<br>
          話しかけたいときはクリックします。名前と役割が緑で表示されます。<br>
          すべてのNPCの名前を表示するには、Oキーを押します（消すときも同じです）。</p>
