      <h1>死んだ仲間の蘇生のしかた</h1>
      </td>
    </tr>
</table>

<p>
Ryzomでは、HPをすべて失ったプレイヤーは昏睡状態になります。昏睡状態になると、HPバーが濃い赤色で満たされていきます。バーがすべて満たされるとプレイヤーは死亡し、復活地点を選んで復活しなければなりません。昏睡状態のプレイヤーは蘇生できますが、死亡したプレイヤーは蘇生できません。</p>

<br><p>昏睡状態のプレイヤーに治癒呪文を唱えると、そのプレイヤーを蘇生できます。治癒呪文を唱えるたびに、濃い赤色のバーが減っていきます。十分な数の治癒呪文を唱えて濃い赤色を完全に消すと、昏睡状態のプレイヤーは息を吹き返します。
</p>
