  ステップ4：キャラクターの外見を整える</p>
<p><br>
  このステップでは、ゲームでのキャラクターの性別、体型、外見を決めます。</p>
<p><img src="../Graph/create_perso/create_perso_modify_character01_512.tga"></p>
<p>記号の付いた円盤をクリックして、キャラクターの性別（男性または女性）を選びます。</p>
<p></p>
<p><img src="../Graph/create_perso/create_perso_modify_character02_512.tga"></p>
<p>キャラクターの外見を整える段階です。<br>
  「体」ボタンをクリックすると、体つきを変更できます。<br>
  「顔」ボタンをクリックすると、顔を変更できます。<br>
  「服装」ボタンをクリックすると、ゲームでキャラクターが着る服の色を選べます。</p>
