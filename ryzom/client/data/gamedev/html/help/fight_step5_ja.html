<p>ステップ5：戦利品</p>
<p>相手を倒すと、その死体からアイテム（＝戦利品）を回収できます。武器や素材などが手に入ります。</p>
<p><img src="../Graph/fight/fight_loot01_256_128.tga"></p>
<p> </p>
<p>死体をクリックします。「戦利品」ウィンドウが開きます。</p>
<p>所持品が開いていなければ、開いてください（Ctrl B）。<br>
</p>
<p>回収したいアイテムをクリックし、所持品にドラッグ＆ドロップします。</p>
