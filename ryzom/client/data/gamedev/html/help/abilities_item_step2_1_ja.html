<p>ステップ2-1：特技 - どこにあるか</p>
<p><br>
  キャラクターの手元：</p>
<p>- ラボモード（F3キーまたは歯車のアイコン）では：</p>
<p>-- 戦闘の特技は戦闘バーにあります。</p>
<p>-- 呪文と魔法の特技は、記憶した呪文のバーにあります。</p>
<p>-- 特殊な特技は特殊バーにあります。</p>
<p>- 特技は、対応する記憶バーに置くことができます。<br>
  - さらに、ショートカットバーに置くこともできます。</p>
<p>特技を購入するには：</p>
<p>- 所属するギルドの建物にいるNPCの師範から特技を購入できます。<br>
</p>
