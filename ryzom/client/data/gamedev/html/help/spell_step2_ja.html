<p>ステップ2：呪文を記憶する </p>
<p><br>
  <img src="../Graph/spell/spell_create02_512_256.tga"> </p>
<p>「魔法」ウィンドウを開いて、呪文を記憶します（ショートカット：M）。</p>
<p>「呪文書」の中から、記憶したい呪文をクリックします。</p>
<p>「魔法」ウィンドウにドラッグ＆ドロップします。</p>
<p><br>
</p>
<p>ショートカットウィンドウに入れて、ショートカットを作っておくことをおすすめします。</p>
<p><img src="../Graph/spell/spell_create03_256.tga"></p>
<p>「魔法」ウィンドウの呪文をクリックし、ショートカットウィンドウにドラッグ＆ドロップします。</p>
