<p>ステップ2-2：特技 - 表示の見方</p>
<p><br>
  シンボル</p>
<p>- 特技（職業に対応）</p>
<p>術者の特技</p>
<p>例：</p>
<table width="75%" border="0">
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_MinorShotProtect.TGA"></td>
    <td width="91%" valign="middle">射撃防護（小）：仲間に一時的な防護の呪文をかけられます</td>
  </tr>
</table>
<p>&nbsp;</p>
<p>戦士の特技</p>
<p>例：</p>
<table width="75%" border="0">
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_BruteForceMeleeFighter.TGA"></td>
    <td width="91%" valign="middle">怪力：近接戦士の特殊な特技。ロングアックスを使って、より大きなダメージを与えます。</td>
  </tr>
</table>
<p><br>
</p>
<p><br>
  レベル</p>
<p>- レベル</p>
<p>数字が大きいほど、レベルが高くなります。</p>
<p>注意：アイテムの効果を十分に得るには、アイコンに表示されたレベル以上に達している必要があります。</p>
<p>例：</p>
<table width="75%" border="0">
  <tr>
    <td width="9%"><img src="../Graph/abilities_items/Icone_BruteForceMeleeFighter.TGA"></td>
    <td width="91%" valign="middle">怪力：近接戦士の特殊な特技 レベル1</td>
  </tr>
</table>
