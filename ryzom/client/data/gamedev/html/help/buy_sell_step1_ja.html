<p><br>
  アイテムを売買するには、商人を見つける必要があります。次の2種類のマティスの建物では、アイテムを売買できます：</p>

<p>どの店にも、中で何を売っているかを示す看板が外に出ています。この店では防具を売っています。<br>
</p>
<p><img src="../Graph/buy_sell/buy_sell_boutique02_256.tga"></p>
<p>この建物（厩舎）は、Ryzomで騎獣（メクトゥーブ）に関するものを何でも買うのに最適な場所です。店と同じように、ここの商人にも、持っているアイテムを何でも売ることができます。<br>
