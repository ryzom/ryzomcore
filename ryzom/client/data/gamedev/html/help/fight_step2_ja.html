<p>ステップ2：近接武器と射撃武器</p>
<p>近接武器とは、接近戦で使うすべての武器のことで、ふつうは手に持って使います。攻撃するには、ターゲットに十分近づく必要があります。</p>
<p>射撃武器とは、ターゲットから離れて使うすべての武器のことです。射撃武器を使うには弾薬が必要で、弾薬がなくなると武器は使えません。</p>
<p><br>
  アドバイス：戦闘を始める前に相手の強さを見極め、弾薬が十分にあるか確認してください。初めて出会う相手なら、ほかのプレイヤーの助けを借りるか、巡回している味方の衛兵の近くから離れないようにしましょう。
</p>
