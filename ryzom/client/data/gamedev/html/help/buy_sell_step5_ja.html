<p><br>
  <br>
  ステップ5：アイテムを売却する</p>
<p><br>
  「取引」の間は、集めたアイテムを売却できます。<br>
</p>
<p><img src="../Graph/buy_sell/buy_sell_choicebox03_512.tga"></p>
<p><br>
  所持品を開きます（Ctrl B）。</p>
<p>売りたいアイテムをクリックします。</p>
<p>「取引」ウィンドウには次のものが表示されます：</p>
<p>- スタックまたはアイテムの買い取り価格</p>
<p>- 売りたい数量も決められます（初期設定ではスタック全体）。</p>
<p><br>
  「売却」をクリックすると、「取引」ウィンドウに表示された金額を受け取ります。<br>
</p>
