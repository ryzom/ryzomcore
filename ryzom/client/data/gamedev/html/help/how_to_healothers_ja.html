      <h1>他人の治癒のしかた</h1>
      </td>
    </tr>
</table>

<p>ほかのプレイヤーを治癒するには、治癒呪文が必要です（「自己回復」の特殊能力ではできません）。治癒呪文を持っていない場合は、魔法師範から習得する必要があります。</p>
<br><p>治癒したいプレイヤーをターゲットにして、アクションバーの治癒呪文のアイコンをクリックします。そのアクションがアクションバーにない場合は、アクション一覧からドラッグ＆ドロップするか、アクションバーの空きスロットを右クリックして作成してください。「自己回復」の特殊能力しかない場合は、ほかのプレイヤーを治癒できないので注意してください。
</p>
