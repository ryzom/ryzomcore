<h1>特技とアイテム</h1>
<table width="75%" border="0">
  <tr>
    <td width="25%"><a href="abilities_item.html">戻る</a></td>
    <td width="75%"><a href="../help.html">ホーム</a></td>

<p><br>
  はじめに</p>
<p>キャラクターは職業によって、武器の扱い、アイテムの製作、呪文の詠唱などのスキルを得ます。</p>
<p>これらのスキルがあると、アイテムを使えるようになります。たとえば、戦闘スキルがあれば武器を使えます。</p>
<p>スキルからは特技も得られます。特技とは、特別なアクションを行うために必要な技能のことです。</p>
<p>たとえば、魔法スキルがあれば、魔法の特技を組み合わせて呪文を作り、唱えることができます。<br>
  同じように、戦闘スキルからは、戦闘で使えるさまざまな特殊攻撃が特技として得られます。</p>
