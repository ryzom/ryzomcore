      <h1><a href="ah:context_help&target=ui:interface:compass&text=uimwCompas">コンパス</a></h1>
      </td>
    </tr>
</table>
<p>
コンパスには、プレイヤーの周りにいるものと、プレイヤーが向いている方向、またはコンパスで選んだ目標の方向が表示されます。
</p>
<p>
<a href="ah:context_help&target=ui:interface:compass:dist&text=uiDistanceto">距離</a>：コンパスで選んだ目標までの距離です（北の場合を除く）。目標を変えるには、コンパスウィンドウの中で右クリックします。<br>
<a href="ah:context_help&target=ui:interface:compass:visuel:range&text=uiRange">範囲</a>：レーダーに表示される範囲の距離です。範囲を変えるには、コンパスウィンドウの上でマウスホイールを回すか、右クリックして「ズームイン」または「ズームアウト」を選びます。<br>
</p>
