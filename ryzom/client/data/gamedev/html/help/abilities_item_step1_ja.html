<p>ステップ1：アイテムとは？</p>
<p>アティスでは、アイテムという言葉には次のものが含まれます：</p>
<p>&middot; 近接武器</p>
<p>&middot; 射撃武器</p>
<p>&middot; 射撃武器用の弾薬</p>
<p>&middot; 衣服</p>
<p>&middot; 防具、盾、ヘルム</p>
<p>&middot; アイテムを製作するための道具</p>
<p>&middot; アイテムの材料になる素材</p>
<p>&middot; 地面や植物、動物の死骸から素材を採るための道具</p>
<p>&middot; 荷獣を導くための調教道具</p>
<p>&middot; 能力値（筋力など）、HP、スタミナ、樹液、耐性（魔法への耐性など）を伸ばすための道具
</p>
