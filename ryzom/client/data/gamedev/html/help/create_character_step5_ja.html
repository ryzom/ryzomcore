<p> <br>
  ステップ5：キャラクターに名前を付ける</p>
<p><br>
  このステップでは、キャラクターが自分に合っているかどうかを確かめられます。あとは名前を付けて、キャラクターに「命」を吹き込むだけです。</p>
<p> <img src="../Graph/create_perso/create_perso_end_512.tga"></p>
<p>キャラクターに付けたい名前を入力します。<br>
  名前にスペースを入れてはいけません。使える文字は基本的なASCIIの英字だけです。<br>
  「OK」をクリックすると、その名前が使えるかどうかがメッセージで表示されます（すでに使われている名前や、禁止されている名前の一覧にある名前は使えません）。</p>
