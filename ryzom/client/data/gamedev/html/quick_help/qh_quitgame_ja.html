<!-- Quit Game Start -->
<P quick_help_events="enter_modal:group=ui:interface:quit_dialog">
	1. ゲームの終了方法です。<br>
	ゲームを終了する方法は2つあります。<br>
	1つ目は「<A z_action_shortcut = "enter_modal" z_action_params = "group=ui:interface:quit_dialog"></A>」キーを押す方法です。<br>
	やってみましょう！
</p>

<!-- Cancel First Method -->
<P quick_help_events="proc:quit_dialog_cancel next"
   quick_help_link  ="ui:interface:quit_dialog:indent_middle:cancel">
	2. よくできました。<br>
	次に、このアイコンをクリックしてキャンセルしてください。<br>
	<a href="ah:context_help&target=ui:interface:quit_dialog:indent_middle:cancel&text=uittGCCancel"><img src="quit_cancel.tga"></img></a><br>
	「ESC」キーを押してもキャンセルできます。<br>

	<br><a href="ah:submit_quick_help&next">- 次へ -</a>
</p>

<!-- Other Icons -->
<P quick_help_events="next">
	3. ほかに2つのアイコンも表示されていたはずです：<br>
	<a href="ah:context_help&target=ui:interface:windows:state:quit&text="><img src="quit_game.tga"></img></a><br>
	キャラクター選択に戻る<br>
	<a href="ah:context_help&target=ui:interface:windows:state:quit&text="><img src="quit_ryzom.tga"></img></a><br>
	ゲームを終了する<br>

	<br><a href="ah:submit_quick_help&next">- 次へ -</a>
</p>

<!-- Second Method -->
<P quick_help_events="button_click:ui:interface:windows:state:quit"
   quick_help_link  ="ah:context_help&target=ui:interface:windows:state:quit&text=">
	4. 2つ目は<a href="ah:context_help&target=ui:interface:windows:state:quit&text=">×印</a>をクリックする方法です。×印は<a href="ah:context_help&target=ui:interface:windows&text=uimwWindowsBar">ウィンドウバー</a>にあります（<a href="qh_windowsbar.html">詳しくはこちら</a>）。<br>

	さあ、やってみましょう！
</p>

<!-- End -->

	-- 終わり --<br>

</p>
